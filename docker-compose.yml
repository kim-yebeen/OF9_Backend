services:
  redis:
    image: redis:7-alpine
    container_name: baseball-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  baseball-diary:
    image: baseball-diary:latest
    container_name: baseball-diary
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # 설정 파일 마운트 (핵심!)
      - ~/config:/app/config
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=jwt,db
      - TZ=Asia/Seoul
      # DB 관련 환경변수 모두 제거!
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
