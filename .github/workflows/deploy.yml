name: Docker Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 캐싱으로 빌드 시간 단축
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon --parallel

      # Docker 이미지 빌드 캐싱
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new \
            --load \
            -t baseball-diary:latest .

      # 캐시 관리
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Save Docker image
        run: docker save baseball-diary:latest | gzip -9 > baseball-diary.tar.gz

      - name: Setup SSH Proxy for Bastion
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          BASTION_HOST: ${{ secrets.EC2_HOST }}
          BASTION_USER: ${{ secrets.EC2_USER }}
          BASTION_PORT: ${{ secrets.EC2_PORT }}
          WAS_HOST: ${{ secrets.WAS_HOST }}
          WAS_USER: ${{ secrets.WAS_USER }}
        run: |
          mkdir -p ~/.ssh/
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat <<EOT >> ~/.ssh/config
          Host bastion
            HostName ${BASTION_HOST}
            User ${BASTION_USER}
            Port ${BASTION_PORT}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no

          Host was_server
            HostName ${WAS_HOST}
            User ${WAS_USER}
            ProxyJump bastion
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          EOT

      - name: Copy files to EC2 WAS Server via Bastion
        run: |
          scp baseball-diary.tar.gz was_server:~/
          scp docker-compose.yml was_server:~/

      - name: Deploy on EC2 WAS Server via Bastion
        run: |
          ssh was_server "
            set -e

            echo '=== 기존 컨테이너 정리 ==='
            docker compose down || true

            echo '=== 기존 이미지 완전 삭제 ==='
            docker rmi baseball-diary:latest -f || true

            echo '=== 불필요한 Docker 리소스 정리 ==='
            docker system prune -af --volumes

            echo '=== 디스크 공간 확인 (정리 전) ==='
            df -h

            echo '=== 로그 파일 정리 ==='
            sudo journalctl --vacuum-time=1d
            sudo find /var/log -type f -name '*.log' -mtime +7 -delete 2>/dev/null || true
          
            echo '=== 임시 파일 정리 ==='
            sudo rm -rf /tmp/* 2>/dev/null || true
          
            echo '=== apt 캐시 정리 ==='
            sudo apt-get clean 2>/dev/null || true
            sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true

            echo '=== 디스크 공간 확인 (정리 후) ==='
            df -h

            echo '=== 이미지 로드 ==='
            docker load < baseball-diary.tar.gz

            echo '=== tar 파일 즉시 삭제 ==='
            rm -f baseball-diary.tar.gz

            echo '=== 디스크 공간 최종 확인 ==='
            df -h

            echo '=== Redis 시작 ==='
            docker compose up -d redis
          
            echo '=== Redis 준비 대기 (최대 30초) ==='
            for i in {1..30}; do
              if docker exec baseball-redis redis-cli ping > /dev/null 2>&1; then
                echo 'Redis 준비 완료'
                break
              fi
              sleep 1
            done

            echo '=== 애플리케이션 시작 ==='
            docker compose up -d baseball-diary

            echo '=== 애플리케이션 준비 대기 (최대 120초) ==='
            for i in {1..120}; do
              if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo '배포 성공!'
                docker ps
                docker stats --no-stream
                exit 0
              fi
              if [ \$i -eq 60 ]; then
                echo '60초 경과 - 로그 확인'
                docker logs --tail 50 baseball-diary
              fi
              sleep 1
            done

            echo '배포 실패 - 로그 출력'
            docker logs --tail 100 baseball-diary
            exit 1
          "