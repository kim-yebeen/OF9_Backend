name: Docker Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Build Docker image
        run: |
          echo "=== Pulling Chrome base image ==="
          docker pull kimyebeen125/java-chrome-base:v3
          echo "=== Testing base image Chrome ==="
          docker run --rm kimyebeen125/java-chrome-base:v3 google-chrome-stable --version
          echo "=== Building application image ==="
          docker build --no-cache -t baseball-diary:latest .
          echo "=== Verifying Chrome in built image ==="
          docker run --rm --entrypoint="" baseball-diary:latest google-chrome-stable --version || echo "⚠ Chrome verification failed!"

      - name: Save Docker image
        run: docker save baseball-diary:latest | gzip > baseball-diary.tar.gz

      - name: Copy files to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ConnectionAttempts=3 -i private_key.pem baseball-diary.tar.gz ${USER}@${HOST}:~/
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ConnectionAttempts=3 -i private_key.pem docker-compose.yml ${USER}@${HOST}:~/

      - name: Deploy on EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          # DB 환경변수 모두 제거! JWT도 파일에서 읽을 예정
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i private_key.pem ${USER}@${HOST} "
            set -e
          
            echo '=== 기존 컨테이너 정리 ==='
            docker compose down || true
            docker stop baseball-diary baseball-redis || true
            docker rm baseball-diary baseball-redis || true
          
            echo '=== 기존 이미지 정리 (최신 2개만 유지) ==='
            docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.CreatedAt}}\t{{.ID}}' | grep baseball-diary | tail -n +3 | awk '{print \$3}' | xargs -r docker rmi -f || true
          
            echo '=== 사용하지 않는 이미지 정리 ==='
            docker image prune -f
          
            echo '=== 디스크 사용량 확인 ==='
            df -h
          
            echo '=== 이미지 로드 ==='
            docker load < baseball-diary.tar.gz
          
            echo '=== Chrome 설치 확인 ==='
            if ! docker run --rm --entrypoint='' baseball-diary:latest google-chrome-stable --version; then
              echo '⚠ Chrome이 설치되지 않았습니다. 배포를 중단합니다.'
              exit 1
            fi
          
            echo '=== 설정 파일 확인 ==='
            ls -la ~/config/
          
            echo '=== Docker Compose로 Redis 먼저 시작 ==='
            docker compose up -d redis
          
            echo '=== Redis 준비 대기 (최대 30초) ==='
            for i in {1..30}; do
              if docker exec baseball-redis redis-cli ping > /dev/null 2>&1; then
                echo '✅ Redis가 준비되었습니다.'
                break
              fi
              echo \"Redis 대기 중... (\$i/30)\"
              sleep 1
            done
          
            echo '=== 애플리케이션 시작 ==='
            docker compose up -d baseball-diary
          
            echo '=== 컨테이너 상태 확인 ==='
            docker ps
          
            echo '=== 애플리케이션 시작 대기 (최대 120초) ==='
            for i in {1..120}; do
              if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo '✅ 애플리케이션이 성공적으로 시작되었습니다!'
                break
              fi
              if [ \$i -eq 120 ]; then
                echo '⚠ 애플리케이션 시작 타임아웃!'
                echo '=== 최근 로그 확인 ==='
                docker logs baseball-diary --tail 50
                exit 1
              fi
              echo \"애플리케이션 대기 중... (\$i/120)\"
              sleep 1
            done
          
            echo '=== Redis 연결 테스트 ==='
            if docker exec baseball-redis redis-cli ping > /dev/null 2>&1; then
              echo '✅ Redis 연결 성공!'
            else
              echo '⚠ Redis 연결 실패!'
              exit 1
            fi
          
            echo '=== 최종 상태 확인 ==='
            docker ps
          
            echo '=== API 헬스 체크 ==='
            if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo '✅ 배포 성공!'
            else
              echo '⚠ 배포 실패!'
              echo '=== 컨테이너 로그 확인 ==='
              docker logs baseball-diary --tail 20
              exit 1
            fi
          
            echo '=== 최종 디스크 사용량 ==='
            df -h
          
            echo '=== tar 파일 정리 ==='
            rm -f ~/baseball-diary.tar.gz
          "
          rm -f private_key.pem
