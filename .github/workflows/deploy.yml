name: Docker Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/baseball-diary:latest

  deploy-on-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          BASTION_HOST: ${{ secrets.EC2_HOST }}
          WAS_HOST: ${{ secrets.WAS_HOST }}
        run: |
          mkdir -p ~/.ssh/
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat <<EOT >> ~/.ssh/config
          Host bastion
            HostName ${BASTION_HOST}
            User ubuntu
            Port 2222
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no

          Host was_server
            HostName ${WAS_HOST}
            User ubuntu
            Port 22
            ProxyJump bastion
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          EOT

      - name: Deploy on WAS Server
        run: |
          ssh was_server "
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/baseball-diary:latest
            docker compose down
            docker compose up -d
          "