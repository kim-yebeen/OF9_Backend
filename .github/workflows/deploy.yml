name: Docker Deploy to EC2 (Remote Build)

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH Proxy for Bastion
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          BASTION_HOST: ${{ secrets.EC2_HOST }}
          BASTION_USER: ${{ secrets.EC2_USER }}
          BASTION_PORT: ${{ secrets.EC2_PORT }}
          WAS_HOST: ${{ secrets.WAS_HOST }}
          WAS_USER: ${{ secrets.WAS_USER }}
        run: |
          mkdir -p ~/.ssh/
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat <<EOT >> ~/.ssh/config
          Host bastion
            HostName ${BASTION_HOST}
            User ${BASTION_USER}
            Port ${BASTION_PORT}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ServerAliveInterval 60
            ServerAliveCountMax 10
            TCPKeepAlive yes

          Host was_server
            HostName ${WAS_HOST}
            User ${WAS_USER}
            ProxyJump bastion
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ServerAliveInterval 60
            ServerAliveCountMax 10
            TCPKeepAlive yes
            Compression yes
          EOT

      - name: Copy source code to EC2
        run: |
          echo "=== 소스 코드 압축 ==="
          tar -czf source.tar.gz \
            --exclude='.git' \
            --exclude='build' \
            --exclude='.gradle' \
            --exclude='*.tar.gz' \
            --exclude='node_modules' \
            --exclude='.idea' \
            --exclude='*.log' \
            . || true
          
          # tar 종료 코드 확인 (1은 경고, 2는 에러)
          TAR_EXIT=$?
          if [ $TAR_EXIT -eq 2 ]; then
            echo "tar 압축 실패"
            exit 1
          fi
          
          echo "=== 파일 크기 확인 ==="
          ls -lh source.tar.gz
          
          echo "=== WAS 서버로 전송 ==="
          scp -o ConnectTimeout=300 -o ServerAliveInterval=30 -C source.tar.gz was_server:~/
          
          echo "=== 전송 완료 ==="

      - name: Build and Deploy on EC2 WAS Server
        run: |
          ssh was_server "
            set -e

            echo '=== 소스 코드 압축 해제 ==='
            rm -rf ~/app
            mkdir -p ~/app
            tar -xzf source.tar.gz -C ~/app/
            cd ~/app
          
            echo '=== 소스 파일 삭제 ==='
            rm ~/source.tar.gz

            echo '=== 기존 컨테이너 정리 ==='
            docker compose down || true

            echo '=== 기존 이미지 삭제 ==='
            docker rmi baseball-diary:latest -f || true

            echo '=== Docker 시스템 정리 ==='
            docker system prune -af --volumes

            echo '=== 디스크 공간 확인 ==='
            df -h

            echo '=== 로그 및 임시 파일 정리 ==='
            sudo journalctl --vacuum-time=1d 2>/dev/null || true
            sudo find /var/log -type f -name '*.log' -mtime +7 -delete 2>/dev/null || true
            sudo rm -rf /tmp/* 2>/dev/null || true

            echo '=== Docker 이미지 빌드 (EC2에서 직접) ==='
            docker build -t baseball-diary:latest .

            echo '=== 빌드 산출물 정리 ==='
            rm -rf ~/app

            echo '=== 디스크 공간 최종 확인 ==='
            df -h

            echo '=== Redis 시작 ==='
            docker compose up -d redis
          
            echo '=== Redis 준비 대기 ==='
            for i in {1..30}; do
              if docker exec baseball-redis redis-cli ping > /dev/null 2>&1; then
                echo 'Redis 준비 완료'
                break
              fi
              sleep 1
            done

            echo '=== 애플리케이션 시작 ==='
            docker compose up -d baseball-diary

            echo '=== 애플리케이션 준비 대기 ==='
            for i in {1..120}; do
              if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo '배포 성공!'
                docker ps
                docker stats --no-stream
                exit 0
              fi
              if [ \$i -eq 60 ]; then
                echo '60초 경과 - 로그 확인'
                docker logs --tail 50 baseball-diary
              fi
              sleep 1
            done

            echo '배포 실패 - 로그 출력'
            docker logs --tail 100 baseball-diary
            exit 1
          "