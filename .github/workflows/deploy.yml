name: Docker Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Build Docker image
        run: |
          echo "=== Pulling Chrome base image ==="
          docker pull kimyebeen125/java-chrome-base:v3
          echo "=== Testing base image Chrome ==="
          docker run --rm kimyebeen125/java-chrome-base:v3 google-chrome-stable --version
          echo "=== Building application image ==="
          docker build --no-cache -t baseball-diary:latest .
          echo "=== Verifying Chrome in built image ==="
          docker run --rm --entrypoint="" baseball-diary:latest google-chrome-stable --version || echo "⚠ Chrome verification failed!"

      - name: Save Docker image
        run: docker save baseball-diary:latest | gzip > baseball-diary.tar.gz

      - name: Copy Docker image to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ConnectionAttempts=3 -i private_key.pem baseball-diary.tar.gz ${USER}@${HOST}:~/

      - name: Deploy on EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i private_key.pem ${USER}@${HOST} "
            echo '=== 기존 컨테이너 정리 ==='
            docker-compose down || true
            docker stop baseball-diary baseball-redis || true
            docker rm baseball-diary baseball-redis || true
          
            echo '=== 기존 이미지 정리 (최신 2개만 유지) ==='
            docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.CreatedAt}}\t{{.ID}}' | grep baseball-diary | tail -n +3 | awk '{print \$3}' | xargs -r docker rmi -f || true
          
            echo '=== 사용하지 않는 이미지 정리 ==='
            docker image prune -f
          
            echo '=== 디스크 사용량 확인 ==='
            df -h
          
            echo '=== 이미지 로드 ==='
            docker load < baseball-diary.tar.gz
          
            echo '=== Chrome 설치 확인 ==='
            docker run --rm --entrypoint='' baseball-diary:latest google-chrome-stable --version || echo '⚠ Chrome verification failed!'
          
            echo '=== Docker Compose로 Redis + App 실행 ==='
            docker-compose up -d
          
            echo '=== 컨테이너 상태 확인 ==='
            docker ps
          
            echo '=== 애플리케이션 시작 대기 ==='
            sleep 30
          
            echo '=== Redis 연결 테스트 ==='
            docker exec baseball-redis redis-cli ping || echo '⚠ Redis connection failed!'
          
            echo '=== 컨테이너 로그 확인 ==='
            docker logs baseball-diary --tail 20
          
            echo '=== API 헬스 체크 ==='
            curl -f http://localhost:8080/actuator/health && echo '✅ 배포 성공!' || echo '⚠ 배포 실패!'
          
            echo '=== 최종 디스크 사용량 ==='
            df -h
          
            echo '=== tar 파일 정리 ==='
            rm -f ~/baseball-diary.tar.gz
          "
          
          rm -f private_key.pem