# .github/workflows/deploy.yml
name: Docker Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Build Docker image
        run: |
          docker build -t baseball-diary:latest .

      - name: Save Docker image
        run: docker save baseball-diary:latest | gzip > baseball-diary.tar.gz

      - name: Copy Docker image to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          scp -o StrictHostKeyChecking=no -i private_key.pem baseball-diary.tar.gz ${USER}@${HOST}:~/

      - name: Deploy on EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} '
            # 기존 컨테이너 중지 및 제거
            docker stop baseball-diary || true
            docker rm baseball-diary || true
          
            # 이미지 로드
            docker load < baseball-diary.tar.gz
          
            # 새 컨테이너 실행
            docker run -d \
              --name baseball-diary \
              -p 8080:8080 \
              --restart unless-stopped \
              --env-file ~/.env \
              baseball-diary:latest
          
            # 컨테이너 상태 확인
            docker ps
            sleep 15
          
            # API 테스트
            curl -f http://localhost:8080/actuator/health && echo "✅ 배포 성공!" || echo "❌ 배포 실패!"
          '
          
          rm -f private_key.pem
