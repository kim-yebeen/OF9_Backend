name: Docker Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build --no-cache -t baseball-diary:latest .

      - name: Save Docker image
        run: docker save baseball-diary:latest | gzip > baseball-diary.tar.gz

      - name: Setup SSH
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          BASTION_HOST: ${{ secrets.EC2_HOST }}
          WAS_HOST: ${{ secrets.WAS_HOST }}
        run: |
          mkdir -p ~/.ssh/
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat <<EOT >> ~/.ssh/config
          Host bastion
            HostName ${BASTION_HOST}
            User ubuntu
            Port 2222
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no

          Host was_server
            HostName ${WAS_HOST}
            User ubuntu
            Port 22
            ProxyJump bastion
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          EOT

      - name: Copy files to WAS Server
        run: |
          scp baseball-diary.tar.gz was_server:~/
          scp docker-compose.yml was_server:~/

      - name: Deploy on WAS Server
        run: |
          ssh was_server "
            docker load < baseball-diary.tar.gz
            docker-compose down
            docker-compose up -d
            rm baseball-diary.tar.gz
          "
