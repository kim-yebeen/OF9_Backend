name: Docker Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Build Docker image
        run: |
          echo "=== Pulling Chrome base image ==="
          docker pull kimyebeen125/java-chrome-base:v2
          echo "=== Testing base image Chrome ==="
          docker run --rm kimyebeen125/java-chrome-base:v2 google-chrome-stable --version
          echo "=== Building application image ==="
          docker build --no-cache -t baseball-diary:latest .
          echo "=== Verifying Chrome in built image ==="
          docker run --rm baseball-diary:latest google-chrome-stable --version || echo "❌ Chrome verification failed!"

      - name: Save Docker image
        run: docker save baseball-diary:latest | gzip > baseball-diary.tar.gz

      - name: Copy Docker image to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ConnectionAttempts=3 -i private_key.pem baseball-diary.tar.gz ${USER}@${HOST}:~/

      - name: Deploy on EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          # GitHub Secrets에서 환경변수 가져오기
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_EXPIRATION: ${{ secrets.JWT_ACCESS_EXPIRATION }}
          JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i private_key.pem ${USER}@${HOST} "
            echo '=== 기존 컨테이너 정리 ==='
            docker stop baseball-diary || true
            docker rm baseball-diary || true
          
            echo '=== 이미지 로드 ==='
            docker load < baseball-diary.tar.gz
          
            echo '=== Chrome 설치 확인 ==='
            docker run --rm baseball-diary:latest google-chrome-stable --version || echo '❌ Chrome verification failed!'
          
            echo '=== 새 컨테이너 실행 ==='
            docker run -d \
              --name baseball-diary \
              -p 8080:8080 \
              --restart unless-stopped \
              -e SPRING_DATASOURCE_URL='$DB_URL' \
              -e SPRING_DATASOURCE_USERNAME='$DB_USERNAME' \
              -e SPRING_DATASOURCE_PASSWORD='$DB_PASSWORD' \
              -e SPRING_DATASOURCE_DRIVER_CLASS_NAME='org.postgresql.Driver' \
              -e SPRING_JPA_HIBERNATE_DDL_AUTO='validate' \
              -e SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT='org.hibernate.dialect.PostgreSQLDialect' \
              -e jwt.secret='$JWT_SECRET' \
              -e jwt.access-expiration='$JWT_ACCESS_EXPIRATION' \
              -e jwt.refresh-expiration='$JWT_REFRESH_EXPIRATION' \
              -e INITIAL_CRAWL_ENABLED='true' \
              -e SPRING_PROFILES_ACTIVE='default' \
              baseball-diary:latest
          
            echo '=== 컨테이너 상태 확인 ==='
            docker ps
          
            echo '=== 컨테이너 내부 Chrome 확인 ==='
            docker exec baseball-diary google-chrome-stable --version || echo '❌ Chrome not working in container!'
          
            echo '=== 애플리케이션 시작 대기 ==='
            sleep 20
          
            echo '=== 컨테이너 로그 확인 ==='
            docker logs baseball-diary --tail 20
          
            echo '=== API 헬스 체크 ==='
            curl -f http://localhost:8080/actuator/health && echo '✅ 배포 성공!' || echo '❌ 배포 실패!'
          "
          
          rm -f private_key.pem